# dsh bundle layer: mount the token-optimizer plugin.
# The plugin package root export (src/index.js) is a Cordis plugin; the
# loader resolves the row by package name after the dsh-base layer inserts.
- insert:
    - id: token-optimizer
      name: '@zoria-lind/dsh-token-optimizer'
      config:
        # T4 layered compaction (off by default; when enabled, src/index.js automatically bypasses compactionDriver's legacy 0.45 threshold path)
        layeredCompact:
          enabled: false
          lowRatio: 0.4
          midRatio: 0.5
          highRatio: 0.65
          highTierTimeoutMs: 120000
          highTierMaxPerSession: 2
          sessionWindowFallback: 262144
        toolTrim:
          enabled: true
          # No more easy-to-stale built-in tool allowlists; new tools are kept when allow is not configured.
          mcpLazy: true
        cache:
          enabled: false
        fileDiff:
          enabled: false
